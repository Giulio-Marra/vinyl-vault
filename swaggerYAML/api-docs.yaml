components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
        path:
          type: string
    NewTrackRequiredDto:
      type: object
      properties:
        title:
          type: string
        trackNumber:
          type: integer
          format: int32
        side:
          type: string
        duration:
          type: string
    NewVinylRequiredDto:
      type: object
      properties:
        title:
          type: string
        urlImage:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        stock:
          type: integer
          format: int32
        artistId:
          type: integer
          format: int64
        genreListId:
          type: array
          items:
            type: integer
            format: int64
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/NewTrackRequiredDto"
    Artist:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        about:
          type: string
        urlImage:
          type: string
    Genre:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    TrackResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        trackNumber:
          type: integer
          format: int32
        side:
          type: string
        duration:
          type: string
    VinylResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        urlImage:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        stock:
          type: integer
          format: int32
        artist:
          $ref: "#/components/schemas/Artist"
        genreList:
          type: array
          items:
            $ref: "#/components/schemas/Genre"
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/TrackResponseDto"
    NewGenreRequiredDto:
      type: object
      properties:
        name:
          type: string
      required:
      - name
    UpdateCartItemRequest:
      type: object
      properties:
        quantity:
          type: integer
          format: int32
          minimum: 1
    CartItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        vinyl:
          $ref: "#/components/schemas/Vinyl"
        quantity:
          type: integer
          format: int32
        price:
          type: number
          format: double
    Vinyl:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        urlImage:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        stock:
